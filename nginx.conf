##############################################################
#  Nginx config for suvidhaair.in
#  Place this file at: /etc/nginx/sites-available/suvidhaair
#  Then: sudo ln -s /etc/nginx/sites-available/suvidhaair /etc/nginx/sites-enabled/
#  Then: sudo nginx -t && sudo systemctl reload nginx
##############################################################

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name suvidhaair.in www.suvidhaair.in;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name suvidhaair.in www.suvidhaair.in;

    # SSL (generated via: sudo certbot --nginx -d suvidhaair.in -d www.suvidhaair.in)
    ssl_certificate     /etc/letsencrypt/live/suvidhaair.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suvidhaair.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # API routes — proxy to Node.js backend
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin dashboard (secret URL — no indexing)
    location /admin {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Prevent search engines indexing /admin
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # All other routes — proxy to Node (serves static public/ folder)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
